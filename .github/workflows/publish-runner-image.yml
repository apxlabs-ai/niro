name: Publish Niro runner image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/apxlabs-ai/niro-runner

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" != "tag" || ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+[.][0-9]+[.][0-9]+ ]]; then
            echo "Runner images must be built from a Niro release tag like v0.1.32" >&2
            exit 1
          fi

          niro_version="${GITHUB_REF_NAME}"
          tags="${IMAGE_NAME}:${GITHUB_REF_NAME}"
          tags="${tags}"$'\n'"${IMAGE_NAME}:latest"

          {
            echo "niro_version=${niro_version}"
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/runner/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            NIRO_VERSION=${{ steps.meta.outputs.niro_version }}
          tags: ${{ steps.meta.outputs.tags }}
