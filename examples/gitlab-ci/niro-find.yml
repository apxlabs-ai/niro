# Niro Find - pentest the application and report findings.
#
# Copy this file to `.gitlab-ci.yml` at your project root (or `include:` it).
# This template uses Claude Code. To use Codex or Copilot CLI instead, see:
# https://github.com/apxlabs-ai/niro/blob/main/docs/supported-agents.md#authenticate-in-ci
#
# Configure either ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN as a masked
# CI/CD variable.

# GitLab.com shared runners (docker:dind) work out of the box: Niro detects the
# docker:dind topology and reaches its scanners over the daemon-published port,
# secured with a mandatory per-run control token, and keeps its own cache/logs
# in a job-scoped dir on the runner build root (outside your repository)
# automatically. No extra runner setup is needed.

stages:
  - security

niro-find:
  stage: security
  image: ubuntu:24.04
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: "1"
    NIRO_CONFIG_DIR: niro
    NIRO_GOAL: "Pentest this application"
    NIRO_CI_ARTIFACT_INCLUDE_FINDINGS: "true"
    NIRO_CI_ARTIFACT_UPLOAD_DEBUG_LOGS: "false"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends nodejs npm git curl ca-certificates docker.io
    - curl -fsSL https://raw.githubusercontent.com/apxlabs-ai/niro/main/install.sh | sh
  script:
    - |
      report_log="$(mktemp)"
      report_stage="$NIRO_CONFIG_DIR/harness/run/reports/$CI_JOB_ID"
      trap 'rm -f "$report_log"' EXIT
      set +e
      niro find \
        --autonomous \
        --goal="$NIRO_GOAL" \
        --agent=claude \
        --config-dir="$NIRO_CONFIG_DIR" \
        --include-findings="$NIRO_CI_ARTIFACT_INCLUDE_FINDINGS" \
        --upload-debug-logs="$NIRO_CI_ARTIFACT_UPLOAD_DEBUG_LOGS" | tee "$report_log"
      niro_status="${PIPESTATUS[0]}"
      set -e
      report_path="$(sed -n 's/^niro: report: //p' "$report_log" | tail -n 1)"
      stage_status=0
      if [ -n "$report_path" ]; then
        mkdir -p "$report_stage" || stage_status=$?
        if [ "$stage_status" -eq 0 ]; then
          cp -- "$report_path" "$report_stage/" || stage_status=$?
        fi
      else
        echo "niro: requested report path missing" >&2
        stage_status=1
      fi
      if [ "$niro_status" -ne 0 ]; then
        exit "$niro_status"
      fi
      exit "$stage_status"
  artifacts:
    when: always
    paths:
      - niro-summary.md
      - niro-knowledge.tar
      - $NIRO_CONFIG_DIR/harness/run/reports/$CI_JOB_ID/penetration-test-report-*.pdf
      - niro-debug-logs.tar
    expire_in: 30 days
