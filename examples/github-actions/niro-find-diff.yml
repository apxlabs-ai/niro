name: Niro Find (diff)

# Pentest what changed in a push (base..head) and report the findings to the job
# summary. Report-only, with no Git write credential or GitHub App.
# Branch-scoped so tag pushes (which have no base to diff) don't trigger it.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: niro-find-diff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  find:
    name: Pentest the push diff and report findings
    # Skip the first push of a branch, where github.event.before is the
    # all-zero SHA and there is no base commit to diff against.
    if: github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # Niro's config dir. Change it in this one place (e.g. niro-staging) and
    # both the run and the artifact upload below follow.
    env:
      NIRO_CONFIG_DIR: niro

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # Full history so Niro can diff base..head locally. The diff needs no
          # runtime network, so don't leave the token in git config.
          fetch-depth: 0
          persist-credentials: false

      - name: Install Niro
        shell: bash
        run: curl -fsSL https://raw.githubusercontent.com/apxlabs-ai/niro/main/install.sh | sh

      # This workflow uses Claude Code. To use Codex or Copilot CLI instead:
      # https://github.com/apxlabs-ai/niro/blob/main/docs/supported-agents.md#authenticate-in-ci
      - name: Run Niro
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # github.event.before is the prior branch head (all-zeros on a brand-new
        # branch — guard or pin a base there).
        run: |
          niro find \
            --autonomous \
            --base-sha="${{ github.event.before }}" \
            --head-sha="${{ github.sha }}" \
            --agent=claude \
            --config-dir="$NIRO_CONFIG_DIR" \
            --include-findings=true \
            --upload-debug-logs=false

      # Upload the report as its own artifact, separate from knowledge.tar, and
      # with archive: false so the download is the PDF itself rather than a zip —
      # you can open it directly, no extraction step. The findings summary already
      # renders in the GitHub job summary, so it needs no upload.
      - name: Upload Niro penetration-test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.NIRO_CONFIG_DIR }}/artifacts/penetration-test-report.pdf
          archive: false
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Niro knowledge
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: niro-knowledge
          path: ${{ env.NIRO_CONFIG_DIR }}/artifacts/knowledge.tar
          if-no-files-found: ignore
          retention-days: 30

      # Change --upload-debug-logs to true above to produce this unsafe bundle.
      - name: Upload debug logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: niro-debug-logs-unsafe
          path: niro-debug-logs.tar
          if-no-files-found: ignore
          retention-days: 7
