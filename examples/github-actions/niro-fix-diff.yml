name: Niro Fix (diff)

# Pentest what changed in a push (base..head) and open review-ready fix PRs.
# Like the whole-app fix workflow it needs the GitHub App (fresh push/PR
# tokens); only the scope differs.
# Scope to your default/source branch. Do NOT leave this unfiltered: Niro pushes
# remediation branches with the App token, and App/PAT pushes are NOT exempt from
# re-triggering workflows the way GITHUB_TOKEN pushes are — an all-branches
# trigger would recurse on Niro's own branches. (Add an actor guard for the App
# bot too if you want belt-and-suspenders.)
on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: niro-fix-diff-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix:
    name: Pentest the push diff and open fix PRs
    # Skip pushes with no base to diff against — the first push of a branch and
    # tag pushes set github.event.before to the all-zero SHA.
    if: github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # Niro's config dir. Change it in this one place (e.g. niro-staging) and
    # both the run and the artifact upload below follow.
    env:
      NIRO_CONFIG_DIR: niro

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # Full history so Niro can diff base..head; no persisted credential —
          # Niro pushes and opens PRs with a fresh GitHub App token.
          fetch-depth: 0
          persist-credentials: false

      - name: Install Niro
        shell: bash
        run: curl -fsSL https://raw.githubusercontent.com/apxlabs-ai/niro/main/install.sh | sh

      # This workflow uses Claude Code. To use Codex or Copilot CLI instead:
      # https://github.com/apxlabs-ai/niro/blob/main/docs/supported-agents.md#authenticate-in-ci
      - name: Run Niro
        shell: bash
        env:
          NIRO_APP_CLIENT_ID: ${{ secrets.NIRO_APP_CLIENT_ID }}
          NIRO_APP_PRIVATE_KEY: ${{ secrets.NIRO_APP_PRIVATE_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # github.event.before is the prior branch head (all-zeros on a brand-new
        # branch — guard or pin a base there).
        run: |
          niro fix \
            --autonomous \
            --base-sha="${{ github.event.before }}" \
            --head-sha="${{ github.sha }}" \
            --agent=claude \
            --config-dir="$NIRO_CONFIG_DIR" \
            --include-findings=true \
            --upload-debug-logs=false

      # The report and knowledge bundle, by stable filename. The findings
      # summary already renders in the GitHub job summary, so it needs no upload.
      - name: Upload Niro artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: niro-artifacts
          path: |
            ${{ env.NIRO_CONFIG_DIR }}/artifacts/penetration-test-report.pdf
            ${{ env.NIRO_CONFIG_DIR }}/artifacts/knowledge.tar
          if-no-files-found: ignore
          retention-days: 30

      # Change --upload-debug-logs to true above to produce this unsafe bundle.
      - name: Upload debug logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: niro-debug-logs-unsafe
          path: niro-debug-logs.tar
          if-no-files-found: ignore
          retention-days: 7
