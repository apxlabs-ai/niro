name: Niro Find

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: niro-find-${{ github.ref }}
  cancel-in-progress: false

jobs:
  find:
    name: Pentest and report findings
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Niro
        shell: bash
        run: curl -fsSL https://raw.githubusercontent.com/apxlabs-ai/niro/main/install.sh | sh

      # This workflow uses Claude Code. To use Codex or Copilot CLI instead:
      # https://github.com/apxlabs-ai/niro/blob/main/docs/supported-agents.md#authenticate-in-ci
      - name: Run Niro
        id: niro
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          report_log="$(mktemp)"
          set +e
          niro find \
            --autonomous \
            --agent=claude \
            --goal="Pentest this application" \
            --config-dir=niro \
            --include-findings=true \
            --upload-debug-logs=false 2>&1 | tee "$report_log"
          niro_status="${PIPESTATUS[0]}"
          set -e
          report_path="$(sed -n 's/^niro: report: //p' "$report_log" | tail -n 1)"
          echo "report_path=$report_path" >> "$GITHUB_OUTPUT"
          exit "$niro_status"

      - name: Upload Niro knowledge
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: niro-knowledge
          path: niro-knowledge.tar
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Niro penetration-test report
        if: always() && steps.niro.outputs.report_path != ''
        uses: actions/upload-artifact@v7
        with:
          name: niro-pentest-report
          path: ${{ steps.niro.outputs.report_path }}
          if-no-files-found: ignore
          retention-days: 30

      # Change --upload-debug-logs to true above to produce this unsafe bundle.
      - name: Upload debug logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: niro-debug-logs-unsafe
          path: niro-debug-logs.tar
          if-no-files-found: ignore
          retention-days: 7
