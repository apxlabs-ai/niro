name: Niro Find (PR)

# Manually pentest a reviewed pull request revision and post the findings as a
# PR comment. Autonomous agent execution must never start merely because
# untrusted repository content opened or updated a PR. Dispatch this workflow
# only after reviewing the revision and trusting it with the model and GitHub
# credentials exposed to this job. Configure required reviewers on the
# `niro-autonomous` environment when you want a second approval gate. This
# tests the reviewed PR head itself, not GitHub's synthetic merge result.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Reviewed pull request number to pentest
        required: true
        type: number
      reviewed_head_sha:
        description: Full head commit SHA that was reviewed
        required: true
        type: string

permissions:
  contents: read # read the repo + PR diff
  pull-requests: write # post the findings comment
  statuses: write # set the Security / Niro commit status

concurrency:
  group: niro-find-pr-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  find:
    name: Pentest the PR and comment findings
    environment: niro-autonomous
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # Niro's config dir. Change it in this one place (e.g. niro-staging) and
    # both the run and the artifact upload below follow.
    env:
      NIRO_CONFIG_DIR: niro

    steps:
      - name: Verify reviewed PR head
        id: review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ENTERPRISE_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REVIEWED_HEAD_SHA: ${{ inputs.reviewed_head_sha }}
        run: |
          if [[ ! "$REVIEWED_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::reviewed_head_sha must be a full 40-character commit SHA"
            exit 1
          fi
          repo_host="${GITHUB_SERVER_URL#https://}"
          repo_host="${repo_host#http://}"
          pr_json="$(gh pr view "$PR_NUMBER" \
            --repo "${repo_host}/${GITHUB_REPOSITORY}" \
            --json headRefOid)"
          current_head="$(jq -r .headRefOid <<<"$pr_json")"
          if [[ "${current_head,,}" != "${REVIEWED_HEAD_SHA,,}" ]]; then
            echo "::error::PR #${PR_NUMBER} moved: reviewed ${REVIEWED_HEAD_SHA}, current ${current_head}"
            exit 1
          fi
          echo "head_sha=$current_head" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # The workflow definition comes from the trusted default branch; only
          # this explicit step checks out the immutable, verified PR head.
          ref: ${{ steps.review.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure read-only Git fetch authentication
        shell: bash
        run: |
          # Niro fetches the PR's captured base/head SHAs with plain git.
          # Delegate those requests to gh without storing the token value. This
          # helper is repository-local; GITHUB_TOKEN has contents: read only.
          git config --local --add credential.helper ""
          git config --local --add credential.helper "!gh auth git-credential"
          git config --local credential.useHttpPath true

      - name: Install Niro
        shell: bash
        run: curl -fsSL https://raw.githubusercontent.com/apxlabs-ai/niro/main/install.sh | sh

      # This workflow uses Claude Code. To use Codex or Copilot CLI instead:
      # https://github.com/apxlabs-ai/niro/blob/main/docs/supported-agents.md#authenticate-in-ci
      - name: Run Niro
        shell: bash
        env:
          # gh reads GH_TOKEN to fetch the PR and post the findings comment;
          # the repo-local git helper reads it for private-repository fetches.
          # GH_ENTERPRISE_TOKEN is the same for Enterprise Server hosts.
          GH_TOKEN: ${{ github.token }}
          GH_ENTERPRISE_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REVIEWED_HEAD_SHA: ${{ steps.review.outputs.head_sha }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          repo_host="${GITHUB_SERVER_URL#https://}"
          repo_host="${repo_host#http://}"
          pr_json="$(gh pr view "$PR_NUMBER" \
            --repo "${repo_host}/${GITHUB_REPOSITORY}" \
            --json headRefOid)"
          current_head="$(jq -r .headRefOid <<<"$pr_json")"
          if [[ "$current_head" != "$REVIEWED_HEAD_SHA" ]]; then
            echo "::error::PR #${PR_NUMBER} moved to ${current_head} after checkout; review and dispatch again"
            exit 1
          fi
          niro find \
            --autonomous \
            --pr-number="${{ inputs.pr_number }}" \
            --agent=claude \
            --config-dir="$NIRO_CONFIG_DIR" \
            --include-findings=true \
            --upload-debug-logs=false

      # Upload the report as its own artifact, separate from knowledge.tar, and
      # with archive: false so the download is the PDF itself rather than a zip —
      # you can open it directly, no extraction step. The findings summary already
      # renders in the GitHub job summary, so it needs no upload.
      - name: Upload Niro penetration-test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.NIRO_CONFIG_DIR }}/artifacts/penetration-test-report.pdf
          archive: false
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Niro knowledge
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: niro-knowledge
          path: ${{ env.NIRO_CONFIG_DIR }}/artifacts/knowledge.tar
          if-no-files-found: ignore
          retention-days: 30

      # Change --upload-debug-logs to true above to produce this unsafe bundle.
      - name: Upload debug logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: niro-debug-logs-unsafe
          path: niro-debug-logs.tar
          if-no-files-found: ignore
          retention-days: 7
