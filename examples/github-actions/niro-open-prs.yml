name: Niro open PRs

on:
  workflow_dispatch:
    inputs:
      agent:
        description: "Agent to use"
        required: true
        type: choice
        default: claude
        options:
          - claude
          - codex
          - copilot
      niro_version:
        description: "Niro version"
        required: true
        default: latest
      upload_debug_artifacts:
        description: "Upload debug logs to GitHub Actions artifacts"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: niro-open-prs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remediate:
    name: Pentest and open PRs
    runs-on: ubuntu-latest
    timeout-minutes: 300
    container:
      image: ghcr.io/apxlabs-ai/niro-runner:${{ inputs.niro_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Initialize Niro
        shell: bash
        run: niro init "$GITHUB_WORKSPACE"

      - name: Run Niro with selected agent
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
        run: run-niro "${{ inputs.agent }}"

      - name: Collect debug logs
        if: always() && inputs.upload_debug_artifacts
        shell: bash
        run: niro-collect-debug-artifacts niro-debug-artifacts

      - name: Upload debug logs as workflow artifact
        if: always() && inputs.upload_debug_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: niro-debug-logs-unsafe
          path: niro-debug-artifacts/**
          if-no-files-found: ignore
          retention-days: 7
